apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    lab.schaermu: infrastructure
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  generators:
    - git:
        repoURL: https://github.com/schaermu/homelab-k8s
        revision: HEAD
        directories:
          - path: k8s/infra/*
  template:
    metadata:
      name: '{{ path.basename }}'
      labels:
        lab.schaermu: infrastructure
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/schaermu/homelab-k8s
        targetRevision: HEAD
        path: '{{ path }}'
      destination:
        name: in-cluster
        namespace: argocd
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
