ingressRoute:
  dashboard:
    enabled: false

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
    internalTrafficPolicy: Local
    loadBalancerIP: 192.168.1.30

tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-schaermu-ch-tls

providers:
  kubernetesIngress:
    publishedService:
      enabled: true
      pathOverride: "traefik/traefik"

ports:
  web:
    expose:
      default: false
  websecure:
    asDefault: true
    expose:
      default: true
    exposedPort: 443
    tls:
      enabled: true
    middlewares:
      - traefik-securityheaders@kubernetescrd
