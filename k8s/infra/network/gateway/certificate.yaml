# gateway/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudflare-cert
  namespace: gateway
spec:
  secretName: cloudflare-cert
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
  commonName: "*.lab.schaermu.ch"
  dnsNames:
    - "*.lab.schaermu.ch"
    - "lab.schaermu.ch"
