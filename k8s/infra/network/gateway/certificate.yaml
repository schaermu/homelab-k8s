---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-lab-schaermu
  namespace: gateway
spec:
  secretName: cert-lab-schaermu
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
  commonName: "*.lab.schaermu.ch"
  dnsNames:
    - "*.lab.schaermu.ch"
    - "lab.schaermu.ch"

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-schaermu
  namespace: gateway
spec:
  secretName: cert-schaermu
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
  commonName: "*.schaermu.ch"
  dnsNames:
    - "*.schaermu.ch"
    - "schaermu.ch"
    - "5768dad9-c92d-4b5c-be07-bb61c56db9c0.cfargotunnel.com" # only to circumvent LE rate limits...
