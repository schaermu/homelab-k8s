# gateway/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
  annotations:
    cert-manager.io/issuer: cloudflare-cluster-issuer
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      l2.cilium.io/ip-pool: default-ip-pool
  addresses:
    - type: IPAddress
      value: 192.168.1.30
  listeners:
    - protocol: HTTPS
      port: 443
      name: https-gateway
      hostname: "*.lab.schaermu.ch"
      tls:
        certificateRefs:
          - kind: Secret
            name: cert-lab-schaermu
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      port: 443
      name: https-domain-gateway
      hostname: lab.schaermu.ch
      tls:
        certificateRefs:
          - kind: Secret
            name: cert-lab-schaermu
      allowedRoutes:
        namespaces:
          from: All
