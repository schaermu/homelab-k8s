---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: hubble-ui-grpc
  namespace: kube-system
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - hubble.lab.schaermu.ch
  rules:
    - backendRefs:
        - name: hubble-ui-grpc
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - hubble.lab.schaermu.ch
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
