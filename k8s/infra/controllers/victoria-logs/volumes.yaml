---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: victoria-logs-storage-0
  namespace: victoria-logs
  labels:
    type: nfs-log-storage
spec:
  capacity:
    storage: 250Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /mnt/MAIN_POOL/data/vmlogs-0
    server: 192.168.1.244

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: victoria-logs-storage-1
  namespace: victoria-logs
  labels:
    type: nfs-log-storage
spec:
  capacity:
    storage: 250Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /mnt/MAIN_POOL/data/vmlogs-1
    server: 192.168.1.244

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-storage
  namespace: victoria-logs
spec:
  storageClassName: ""
  selector:
    matchLabels:
      type: nfs-log-storage
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
