---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: controllers
  source:
    chart: cnpg
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.27.0
    helm:
      releaseName: cnpg/cloudnative-pg
  destination:
    name: in-cluster
    namespace: cnpg-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
