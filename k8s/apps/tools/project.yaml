apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tools
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sourceRepos:
    - 'https://github.com/schaermu/homelab-k8s'
  destinations:
    - namespace: 'argocd'
      server: '*'
    - namespace: 'vaultwarden'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
