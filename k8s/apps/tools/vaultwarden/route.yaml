---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-ui
  namespace: vaultwarden
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - vault.schaermu.ch
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
