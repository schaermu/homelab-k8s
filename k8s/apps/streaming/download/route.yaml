---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-ui
  namespace: download
spec:
  parentRefs:
  - name: internal
    namespace: gateway
  hostnames:
  - torrent.lab.schaermu.ch
  rules:
  - backendRefs:
    - name: qbittorrent
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd-ui
  namespace: download
spec:
  parentRefs:
  - name: internal
    namespace: gateway
  hostnames:
  - usenet.lab.schaermu.ch
  rules:
  - backendRefs:
    - name: sabnzbd
      port: 8090
    matches:
    - path:
        type: PathPrefix
        value: /
