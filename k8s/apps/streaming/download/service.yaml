---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: download
  labels:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
spec:
  selector:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: qbittorrent

---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: download
  labels:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
spec:
  selector:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: sabnzbd
    - name: http-api
      port: 9090
      targetPort: sabnzbd-api
