---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-download-clients
  namespace: download
  labels:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: download-clients
      app.kubernetes.io/instance: download-clients
  template:
    metadata:
      labels:
        app.kubernetes.io/name: download-clients
        app.kubernetes.io/instance: download-clients
    spec:
      serviceAccountName: download-clients
      volumes:
      - name: gluetun-config
        secret:
          secretName: gluetun-config
      - name: qbittorrent-default-config
        configMap:
          name: qbittorrent-default-config
      - name: qbittorrent-config-pv
        persistentVolumeClaim:
          claimName: qbittorrent-config-pvc
      - name: sabnzbd-config
        secret:
          secretName: sabnzbd-config-secret
      - name: sabnzbd-config-pv
        persistentVolumeClaim:
          claimName: sabnzbd-config-pvc
      - name: download-data
        persistentVolumeClaim:
          claimName: download-data
      - name: sabnzbd-config-hack
        emptyDir: {}
      - name: qbittorrent-config-hack
        emptyDir: {}
      - name: lsio-modcache
        persistentVolumeClaim:
          claimName: lsio-modcache-pvc
      initContainers:
        - name: fix-config-permissions
          image: busybox:1.36.0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cp /config/qBittorrent.conf /tmp/qbittorrent/qBittorrent.conf &&
              cp /config/sabnzbd.ini /tmp/sabnzbd/sabnzbd.ini;
              chown -R 3001:3001 /tmp
          volumeMounts:
          - name: sabnzbd-config-hack
            mountPath: /tmp/sabnzbd
          - name: qbittorrent-config-hack
            mountPath: /tmp/qbittorrent
          - name: sabnzbd-config
            mountPath: /config/sabnzbd.ini
            subPath: sabnzbd.ini
          - name: qbittorrent-default-config
            mountPath: /config/qBittorrent.conf
            subPath: qBittorrent.conf
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.0
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          ports:
          - name: control-server
            containerPort: 8000
            protocol: TCP
          - name: http-proxy
            containerPort: 8888
            protocol: TCP
          - name: tcp-shadowsocks
            containerPort: 8388
            protocol: TCP
          - name: udp-shadowsocks
            containerPort: 8388
            protocol: UDP
          env:
          - name: TZ
            value: "Europe/Zurich"
          - name: FIREWALL_DEBUG
            value: "on"
          - name: FIREWALL_INPUT_PORTS
            value: "8080,8090"
          - name: FIREWALL_OUTBOUND_SUBNETS
            value: "10.244.0.0/16"
          - name: SERVER_COUNTRIES
            value: "Switzerland"
          - name: VPN_SERVICE_PROVIDER
            value: "protonvpn"
          - name: VPN_TYPE
            value: "wireguard"
          - name: PORT_FORWARD_ONLY
            value: "on"
          - name: VPN_PORT_FORWARDING
            value: "on"
          - name: WIREGUARD_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: gluetun-config
                key: WIREGUARD_PRIVATE_KEY
          livenessProbe:
            exec:
              command: ["ip","a","show","tun0"]
          readinessProbe:
            exec:
              command: ["ip","a","show","tun0"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            limits:
              squat.ai/tun: "1"
          volumeMounts:
          - name: gluetun-config
            mountPath: /gluetun/auth/config.toml
            subPath: gluetun.toml
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.1.4
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp /tmp/initial-config/qBittorrent.conf /config/qBittorrent/qBittorrent.conf || true"]
          envFrom:
          - configMapRef:
              name: qbittorrent-config
          env:
          - name: GSP_GTN_API_KEY
            valueFrom:
              secretKeyRef:
                name: gluetun-config
                key: GSP_GTN_API_KEY
          - name: GSP_QBT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gluetun-config
                key: GSP_QBT_PASSWORD
          ports:
          - name: qbittorrent
            containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
          livenessProbe:
            initialDelaySeconds: 60 # slow startup due to docker mods
            httpGet:
              path: /
              port: qbittorrent
          readinessProbe:
            initialDelaySeconds: 60 # slow startup due to docker mods
            httpGet:
              path: /
              port: qbittorrent
          volumeMounts:
          - name: download-data
            mountPath: /downloads
            subPath: download/torrents
          - name: qbittorrent-default-config
            mountPath: /tmp/initial-config/qBittorrent.conf
            subPath: qBittorrent.conf
          - name: qbittorrent-config-pv
            mountPath: /config
          - name: lsio-modcache
            mountPath: /modcache
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:4.5.5
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp /tmp/initial-config/sabnzbd.ini /config/sabnzbd.ini || true"]
          ports:
          - name: sabnzbd
            containerPort: 8090
          - name: sabnzbd-api
            containerPort: 9090
          resources:
            requests:
              memory: "500Mi"
              cpu: "25m"
            limits:
              memory: "4096Mi"
          livenessProbe:
            httpGet:
              path: /
              port: sabnzbd
          readinessProbe:
            httpGet:
              path: /
              port: sabnzbd
          envFrom:
          - configMapRef:
              name: sabnzbd-config
          volumeMounts:
          - name: download-data
            mountPath: /downloads
            subPath: download/usenet
          - name: sabnzbd-config-pv
            mountPath: /config
          - name: sabnzbd-config-hack
            mountPath: /tmp/initial-config
