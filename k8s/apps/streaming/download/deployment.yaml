---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-download-clients
  namespace: download
  labels:
    app.kubernetes.io/name: download-clients
    app.kubernetes.io/instance: download-clients
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: download-clients
      app.kubernetes.io/instance: download-clients
  template:
    metadata:
      labels:
        app.kubernetes.io/name: download-clients
        app.kubernetes.io/instance: download-clients
    spec:
      serviceAccountName: download-clients
      volumes:
        - name: gluetun-config
          secret:
            secretName: gluetun-config
        - name: qbittorrent-default-config
          configMap:
            name: qbittorrent-default-config
        - name: qbittorrent-config-pv
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: sabnzbd-config
          secret:
            secretName: sabnzbd-config-secret
        - name: sabnzbd-config-pv
          persistentVolumeClaim:
            claimName: sabnzbd-config-pvc
        - name: download-data
          persistentVolumeClaim:
            claimName: download-data

      initContainers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.0
          restartPolicy: Always
          imagePullPolicy: IfNotPresent
          ports:
            - name: control-server
              containerPort: 8000
              protocol: TCP
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
            - name: tcp-shadowsocks
              containerPort: 8388
              protocol: TCP
            - name: udp-shadowsocks
              containerPort: 8388
              protocol: UDP
          env:
            - name: TZ
              value: "Europe/Zurich"
            - name: FIREWALL_DEBUG
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8090"
            - name: SERVER_COUNTRIES
              value: "Switzerland"
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-config
                  key: WIREGUARD_PRIVATE_KEY
          livenessProbe:
            exec:
              command: ["ip","a","show","tun0"]
          readinessProbe:
            exec:
              command: ["ip","a","show","tun0"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            limits:
              squat.ai/tun: "1"
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun/auth/config.toml
              subPath: gluetun.toml
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.1.4
          imagePullPolicy: IfNotPresent
          ports:
          - name: torrent-http
            containerPort: 8080
            protocol: TCP
          - name: torrent-tcp
            containerPort: 6881
            protocol: TCP
          - name: torrent-udp
            containerPort: 6881
            protocol: UDP
          envFrom:
          - configMapRef:
              name: qbittorrent-config
          env:
          - name: GSP_GTN_API_KEY
            valueFrom:
              secretKeyRef:
                name: gluetun-config
                key: GSP_GTN_API_KEY
          - name: GSP_QBT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gluetun-config
                key: GSP_QBT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: torrent-http
          readinessProbe:
            httpGet:
              path: /
              port: torrent-http
          volumeMounts:
          - name: qbittorrent-default-config
            mountPath: /config/qBittorrent/qBittorrent.conf
            subPath: qBittorrent.conf
          - name: qbittorrent-config-pv
            mountPath: /config
          - name: download-data
            mountPath: /downloads
            subPath: torrents
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:4.5.5
          imagePullPolicy: IfNotPresent
          ports:
          - name: sabnzbd
            containerPort: 8090
            protocol: TCP
          - name: sabnzbd-api
            containerPort: 9090
            protocol: TCP
          resources:
            requests:
              memory: "500Mi"
              cpu: "25m"
            limits:
              memory: "4096Mi"
          envFrom:
          - configMapRef:
              name: sabnzbd-config
          volumeMounts:
          - name: download-data
            mountPath: /downloads
            subPath: usenet
          - name: sabnzbd-config-pv
            mountPath: /config
          - name: sabnzbd-config
            mountPath: /config/sabnzbd.ini
            subPath: sabnzbd.ini
            readOnly: false
