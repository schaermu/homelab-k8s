---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: gluetun-config
  namespace: download
spec:
  encryptedData:
    GSP_GTN_API_KEY: 
    GSP_QBT_PASSWORD: 
    WIREGUARD_PRIVATE_KEY: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: gluetun-config
      namespace: download
    type: Opaque
    data:
      gluetun.toml: |
        [[roles]]
        name = "t-anc/GSP-Qbittorent-Gluetun-sync-port-mod"
        routes = ["GET /v1/portforward"]
        auth = "apikey"
        apikey = {{ toJson .GSP_GTN_API_KEY }}

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: sabnzbd-config-secret
  namespace: download
spec:
  encryptedData:
    API_KEY: 
    EWEKA_PASSWORD: 
    EWEKA_USERNAME: 
    NZB_KEY: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: sabnzbd-config-secret
      namespace: download
    type: Opaque
    data:
      sabnzbd.ini: |
        [misc]
        port = 8090
        api_key = {{ toJson .API_KEY }}
        nzb_key = {{ toJson .NZB_KEY }}
        download_dir = /downloads/incomplete
        complete_dir = /downloads/complete
        host_whitelist = sabnzbd.download,usenet.lab.schaermu.ch
        check_new_rel = 0
        auto_browser = 0
        [servers]
        [[news.eweka.nl]]
        name = news.eweka.nl
        displayname = news.eweka.nl
        host = news.eweka.nl
        port = 563
        timeout = 60
        username = {{ toJson .EWEKA_USERNAME }}
        password = {{ toJson .EWEKA_PASSWORD }}
        connections = 50
        ssl = 1
        enable = 1
        [categories]
        [[music]]
        name = music
        dir = music
        [[movies]]
        name = movies
        dir = movies
        [[tv]]
        name = tv
        dir = tv


