---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: gluetun-config
  namespace: download
spec:
  encryptedData:
    GSP_GTN_API_KEY: 
    GSP_QBT_PASSWORD: 
    WIREGUARD_PRIVATE_KEY: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: gluetun-config
      namespace: download
    type: Opaque
    data:
      GSP_GTN_API_KEY: {{ .GSP_GTN_API_KEY }}
      GSP_QBT_PASSWORD: {{ .GSP_QBT_PASSWORD }}
      WIREGUARD_PRIVATE_KEY: {{ .WIREGUARD_PRIVATE_KEY }}
      gluetun.toml: |
        [[roles]]
        name = "t-anc/GSP-Qbittorent-Gluetun-sync-port-mod"
        routes = ["GET /v1/portforwarded"]
        auth = "apikey"
        apikey = {{ toJson .GSP_GTN_API_KEY }}
