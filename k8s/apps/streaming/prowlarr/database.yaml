---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prowlarr-db
  namespace: prowlarr
spec:
  instances: 3
  imagePullPolicy: Always
  primaryUpdateStrategy: unsupervised
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: minio-store
      serverName: prowlarr-db
  storage:
    storageClass: longhorn-db-volumes
    size: 10Gi
  walStorage:
    storageClass: longhorn-db-volumes
    size: 2Gi
  nodeMaintenanceWindow:
    reusePVC: false # rebuild from other replica instead

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prowlarr-log-database
  namespace: prowlarr
spec:
  name: prowlarr-log
  owner: app
  ensure: absent
  cluster:
    name: prowlarr-db
  extensions:
    - name: bloom
      ensure: present

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: prowlarr-db-backup
  namespace: prowlarr
spec:
  cluster:
    name: prowlarr-db
  schedule: "0 0 3 * * *" # every day at 3:00 AM
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: minio-store
      serverName: prowlarr-db
