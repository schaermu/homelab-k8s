---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamanager
  namespace: mediamanager
  labels:
    app.kubernetes.io/name: mediamanager
    app.kubernetes.io/instance: mediamanager
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamanager
      app.kubernetes.io/instance: mediamanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediamanager
        app.kubernetes.io/instance: mediamanager
    spec:
      serviceAccountName: mediamanager
      securityContext:
        fsGroup: 3001
      volumes:
        - name: etc-hack
          emptyDir: {}
        - name: mediamanager-data
          nfs:
            path: /mnt/MAIN_POOL/data
            server: 192.168.1.244
        - name: mediamanager-config
          persistentVolumeClaim:
            claimName: mediamanager-config
        - name: mediamanager-images
          persistentVolumeClaim:
            claimName: mediamanager-images
        - name: mediamanager-config-file
          configMap:
            name: mediamanager-config
      initContainers:
      - name: fix-permissions
        image: ghcr.io/maxdorninger/mediamanager/mediamanager:1.11.1
        command: ["/bin/sh", "-c"]
        args:
        - mkdir -p /opt/hacked-etc;
          cp /etc/passwd /opt/hacked-etc/passwd;
          echo "media:x:3001:3001:Media User:${PWD}:/bin/false" >> /opt/hacked-etc/passwd
          cat /opt/hacked-etc/passwd;
          chown -R 3001:3001 /app;
          ls -la /app;
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
          - name: etc-hack
            mountPath: /opt/hacked-etc
          - name: mediamanager-config
            mountPath: /app/config
          - name: mediamanager-images
            mountPath: /app/images
      containers:
      - name: mediamanager-server
        image: ghcr.io/maxdorninger/mediamanager/mediamanager:1.11.1
        securityContext:
          runAsUser: 3001
          runAsGroup: 3001
        envFrom:
        - secretRef:
            name: mediamanager-config-secrets
        env:
          - name: CONFIG_DIR
            value: /app/config
          - name: MEDIAMANAGER_DATABASE__HOST
            value: mediamanager-db-rw.mediamanager
          - name: MEDIAMANAGER_DATABASE__DBNAME
            valueFrom:
              secretKeyRef:
                name: mediamanager-db-app
                key: dbname
          - name: MEDIAMANAGER_DATABASE__USER
            valueFrom:
              secretKeyRef:
                name: mediamanager-db-app
                key: username
          - name: MEDIAMANAGER_DATABASE__PASSWORD
            valueFrom:
              secretKeyRef:
                name: mediamanager-db-app
                key: password
        volumeMounts:
          - mountPath: /data
            name: mediamanager-data
            #subPath: media
          - mountPath: /app/config
            name: mediamanager-config
          - name: mediamanager-config-file
            mountPath: /app/config/config.toml
            subPath: config.toml
          - mountPath: /app/images
            name: mediamanager-images
          - name: etc-hack
            mountPath: /etc/passwd
            subPath: passwd
