---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-pv
  namespace: streaming
  labels:
    bucket: shared
spec:
  capacity:
    storage: 20T
  volumeMode: Filesystem
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  nfs:
    server: 192.168.1.244
    path: /mnt/MAIN_POOL/data
  readOnly: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: streaming
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 20T
  selector:
    matchLabels:
      bucket: shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamanager-config
  namespace: mediamanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamanager-images
  namespace: mediamanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
